vendor: cursor
display_name: Cursor
last_reviewed: 2026-05-04
confidence: provisional
plugin_model: package_manifest
has_package_manifest: true
direct_config_surfaces:
  - .cursor/rules/*.mdc
  - .cursor/commands/*.md
  - AGENTS.md
  - CLAUDE.md
  - MCP configuration shared by editor and CLI
plugin_config_surfaces:
  - .cursor-plugin/plugin.json
  - skills/
  - commands/
  - rules/
  - hooks/hooks.json
  - MCP configuration
marketplace_surfaces:
  - .cursor-plugin/marketplace.json
  - Cursor Marketplace
  - /add-plugin <plugin>
notes:
  - Previous direct-config-only assessment is stale as of the 2026 Cursor plugin announcement.
  - Cursor now documents marketplace plugins that bundle MCP servers, skills, subagents, rules, and hooks.
  - Verified public plugin examples use a root .cursor-plugin/marketplace.json with plugin entries whose source points at a plugin subdirectory.
  - Verified public plugin examples put plugin package metadata at <plugin>/.cursor-plugin/plugin.json.
  - Cursor CLI 3.0.16 does not expose plugin management commands; the verified user-facing install surface is marketplace /add-plugin <plugin>.
  - Public submission and non-marketplace repository install flows still need verification before adapter changes.
  - MCP is configured directly rather than through a verified plugin package model.
